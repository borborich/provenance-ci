version: 1

# Test-only roots copied from the pinned upstream SDK fixture corpus.
# Never use these development anchors as a production trust list.
trust:
  anchorsPath: ../fixtures/official/test-trust-anchors.pem
  id: c2pa-rs-0.90.3-test-roots

checks:
  - id: trusted-test-signer
    checkpoints:
      - name: source
        path: ../fixtures/official/C.jpg
    policy:
      requireCredential: true
      requireValidBinding: true
      requireTrusted: true
      continuity: any
      onInconclusive: fail

