[package]
name = "provenance-ci"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
description = "CI regression and continuity testing for Content Credentials across publishing checkpoints"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/borborich/provenance-ci"
readme = "README.md"
publish = false

[dependencies]
anyhow = "=1.0.104"
c2pa = { version = "=0.90.3", default-features = false, features = ["rust_native_crypto"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "=4.5.48", features = ["derive"] }
hex = "=0.4.3"
reqwest = { version = "=0.12.23", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml = "=0.9.34"
sha2 = "=0.10.9"
url = "=2.5.8"

[dev-dependencies]
assert_cmd = "=2.0.17"
predicates = "=3.1.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
